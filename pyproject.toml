[project]
name = "kojakstreet"
version = "0.2.0"
description = "A desktop financial-market simulation migrating from Tkinter to PySide6."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Özay Kocak" },
]
dependencies = [
    "duckdb>=1.1",
    "numpy>=2.0",
    "PySide6>=6.8",
    "pyqtgraph>=0.14",
]

[project.scripts]
kojakstreet-qt = "kojakstreet.ui_qt.app:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    "build",
    "dist",
    "release",
    ".cache",
    ".venv",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
