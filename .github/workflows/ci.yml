name: Regression and installation
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install Qt system libraries on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libopengl0
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q --junitxml=test-results.xml
      - run: python -m compileall -q src tests tools
      - run: python tools/wheel_smoke.py
      - run: python tools/source_smoke.py --output source-smoke.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tests-${{ matrix.os }}-${{ matrix.python }}
          path: |
            test-results.xml
            source-smoke.json
